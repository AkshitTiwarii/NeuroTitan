<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>The chain in one picture: one sentence, English against Odia</title><rect width="760" height="400" rx="6" fill="#fbfaf7"/><text x="24" y="32" font-size="16" font-weight="600" fill="#151515">One sentence, English against Odia, followed down the chain</text><text x="24" y="52" font-size="12" fill="#646464">Qwen3-8B reading one average FLORES sentence. Each step says how we know it.</text><rect x="24" y="78" width="166" height="168" rx="6" fill="#ffffff" stroke="#e4e1db"/><text x="36" y="102" font-size="13" font-weight="600" fill="#151515">Tokens</text><text x="36" y="136" font-size="10.5" fill="#646464" letter-spacing="0.06em">MEASURED</text><circle cx="42" cy="164" r="5" fill="#2a78d6"/><text x="54" y="168" font-size="12" fill="#3b3b3b">English</text><text x="178" y="168" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">27.3</text><circle cx="42" cy="192" r="5" fill="#eb6834"/><text x="54" y="196" font-size="12" fill="#3b3b3b">Odia</text><text x="178" y="196" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">264.7</text><text x="36" y="230" font-size="20" font-weight="600" fill="#151515">9.70×</text><path d="M192,162 l12,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#646464" stroke-width="1.5"/><rect x="208" y="78" width="166" height="168" rx="6" fill="#ffffff" stroke="#e4e1db"/><text x="220" y="102" font-size="13" font-weight="600" fill="#151515">Multiply-adds</text><text x="220" y="136" font-size="10.5" fill="#646464" letter-spacing="0.06em">DERIVED</text><circle cx="226" cy="164" r="5" fill="#2a78d6"/><text x="238" y="168" font-size="12" fill="#3b3b3b">English</text><text x="362" y="168" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">204.5 billion</text><circle cx="226" cy="192" r="5" fill="#eb6834"/><text x="238" y="196" font-size="12" fill="#3b3b3b">Odia</text><text x="362" y="196" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">2.02 trillion</text><text x="220" y="230" font-size="20" font-weight="600" fill="#151515">9.86×</text><path d="M376,162 l12,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#646464" stroke-width="1.5"/><rect x="392" y="78" width="166" height="168" rx="6" fill="#ffffff" stroke="#e4e1db"/><text x="404" y="102" font-size="13" font-weight="600" fill="#151515">Energy on a sky130</text><text x="404" y="118" font-size="13" font-weight="600" fill="#151515">chip, 1.8 V</text><text x="404" y="136" font-size="10.5" fill="#646464" letter-spacing="0.06em">SIMULATED</text><circle cx="410" cy="164" r="5" fill="#2a78d6"/><text x="422" y="168" font-size="12" fill="#3b3b3b">English</text><text x="546" y="168" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">0.25 J</text><circle cx="410" cy="192" r="5" fill="#eb6834"/><text x="422" y="196" font-size="12" fill="#3b3b3b">Odia</text><text x="546" y="196" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">2.5 J</text><text x="404" y="230" font-size="20" font-weight="600" fill="#151515">9.86×</text><path d="M560,162 l12,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#646464" stroke-width="1.5"/><rect x="576" y="78" width="166" height="168" rx="6" fill="#ffffff" stroke="#e4e1db"/><text x="588" y="102" font-size="13" font-weight="600" fill="#151515">Charge through the</text><text x="588" y="118" font-size="13" font-weight="600" fill="#151515">supply</text><text x="588" y="136" font-size="10.5" fill="#646464" letter-spacing="0.06em">DERIVED</text><circle cx="594" cy="164" r="5" fill="#2a78d6"/><text x="606" y="168" font-size="12" fill="#3b3b3b">English</text><text x="730" y="168" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">8.8 × 10¹⁷ e</text><circle cx="594" cy="192" r="5" fill="#eb6834"/><text x="606" y="196" font-size="12" fill="#3b3b3b">Odia</text><text x="730" y="196" font-size="12.5" fill="#151515" text-anchor="end" font-weight="600">8.7 × 10¹⁸ e</text><text x="588" y="230" font-size="20" font-weight="600" fill="#151515">9.86×</text><rect x="24" y="270" width="712" height="86" rx="6" fill="#ffffff" stroke="#e4e1db"/><text x="40" y="296" font-size="13" font-weight="600" fill="#151515">On a GPU server shared by 64 users (a page of text in, a short answer out)</text><text x="40" y="318" font-size="12" fill="#3b3b3b">Weight reads are shared, and work that depends on context grows with the square of the length.</text><text x="40" y="340" font-size="12" fill="#3b3b3b">Odia then costs <tspan font-weight="600" fill="#151515">16.5× English's energy</tspan>, against 9.7× the tokens. DERIVED, published energies.</text><text x="748" y="392" font-size="9.5" fill="#646464" text-anchor="end">Data: m1, m2, m3a/mac.json, m4/chain_per_language.csv. "e" = electrons of charge.</text></svg>
